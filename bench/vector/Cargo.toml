[package]
name = "dqadb-bench-vector"
version = "0.1.0"
edition = "2024"
publish = false

# standalone: LanceDB pulls in Arrow/DataFusion/Lance (a long build)
[workspace]

[dependencies]
dqadb-core = { path = "../../crates/dqadb-core" }
lancedb = "=0.41.0"
lance-index = "=14.0.2"
arrow-array = "58"
arrow-schema = "58"
parquet = { version = "58", default-features = false, features = ["arrow", "snap", "zstd"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
serde_yaml = "0.9"
memmap2 = "0.9"
usearch = "=2.26.6"
ureq = { version = "3.5.1", features = ["json"] }

[profile.release]
debug = false
